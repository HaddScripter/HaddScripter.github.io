<style>

:root[data-theme="dark"]{--bg:#0B1512;--mist:#14231E;--card:#101D18;--ink:#E9F3EE;--mut:#95A89E;--ln:#24362F;--em:#6FE3B5;--btn:#A7F3D0;--btnt:#0B1512;--nb:rgba(16,29,24,.85)}

button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;transition:transform .12s}

main{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 20px 20px}
main.in{animation:in .35s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.top{display:flex;justify-content:space-between;align-items:center;min-height:44px;margin-bottom:8px}
.lg{display:flex;align-items:center;gap:8px;font-weight:700}
.lg i{width:30px;height:30px;border-radius:10px;background:var(--btn);color:var(--btnt);display:grid;place-items:center}
.ib{width:44px;height:44px;border-radius:50%;background:var(--mist);display:grid;place-items:center}
h1{font-size:clamp(28px,8.5vw,36px);line-height:1.05;letter-spacing:-1.2px;margin:6px 0 4px;overflow-wrap:anywhere}

h3{margin:0 0 8px;font-size:20px}
.sub,.mut{color:var(--mut)}.sub{margin:0}
.note{font-size:12.5px;color:var(--mut);margin:8px 2px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:22px;padding:16px;margin-top:12px}
.card p{margin:4px 0 8px}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between}
.pill{display:inline-block;background:var(--mist);color:var(--em);font-weight:600;font-size:12.5px;padding:3px 10px;border-radius:99px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:16px;background:var(--btn);color:var(--btnt);font-weight:600;margin-top:12px;text-decoration:none;padding:0 16px;text-align:center}
.btn.g{background:var(--mist);color:var(--ink)}.btn:disabled{opacity:.5;cursor:default}
.bar{height:8px;border-radius:5px;background:var(--mist);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--tq),var(--ac));border-radius:5px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.hero{display:block;width:100%;max-width:340px;margin:4px auto 0}
.flow{fill:none;stroke:var(--ac);stroke-width:3;stroke-dasharray:3 9;stroke-linecap:round;animation:fl 6s linear infinite}
@keyframes fl{to{stroke-dashoffset:-48}}
.nd{cursor:pointer}.nd circle{fill:var(--card);stroke:var(--ln);stroke-width:2}.nd g{stroke:var(--ink)}
.nd.on circle{fill:var(--btn);stroke:var(--mint);stroke-width:3}.nd.on g{stroke:var(--btnt)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.stats div{padding:14px 4px;text-align:center}.stats b{display:block;font-size:30px;line-height:1;letter-spacing:-1px}.stats span{font-size:12.5px;color:var(--mut)}
.seg{display:flex;gap:4px;background:var(--mist);padding:4px;border-radius:16px;margin:10px 0}
.seg button{flex:1;min-height:40px;border-radius:12px;font-weight:600;font-size:14px;color:var(--mut)}
.seg .on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,40,30,.12)}
.scn{position:relative;height:290px;border-radius:26px;background:linear-gradient(160deg,#123C32,#0c2a23 60%,#18A878);display:grid;place-items:center;overflow:hidden}
.scn i{position:absolute;width:42px;height:42px;border:0 solid #A7F3D0;border-radius:10px}
.c1{top:44px;left:34px;border-width:4px 0 0 4px!important}.c2{top:44px;right:34px;border-width:4px 4px 0 0!important}.c3{bottom:24px;left:34px;border-width:0 0 4px 4px!important}.c4{bottom:24px;right:34px;border-width:0 4px 4px 0!important}
.tg{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.16);color:#fff;font-size:12.5px;padding:4px 12px;border-radius:99px;white-space:nowrap}
.ln{position:absolute;left:34px;right:34px;top:46px;height:3px;background:#A7F3D0;box-shadow:0 0 14px #A7F3D0;opacity:0}
.go .ln{opacity:1;animation:sl 1.2s ease-in-out}

.opt.ok{background:#A7F3D0;color:#06281f}.opt.no{background:#FBD5D0;color:#5b1008}.opt.ok:after{content:"✓"}.opt.no:after{content:"✕"}

.map{display:block;width:100%;border-radius:22px;background:var(--mist)}
.pin{cursor:pointer}
.in{width:100%;height:50px;border-radius:14px;border:2px solid var(--ln);background:var(--card);color:var(--ink);font:inherit;font-size:16px;padding:0 14px}
.chips{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.chip{padding:0 16px;min-height:40px;border-radius:99px;background:var(--mist);font-weight:600}.chip.on{background:var(--btn);color:var(--btnt)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.grid2 .card{margin:0;display:flex;flex-direction:column;gap:6px}.grid2 .card p{flex:1;font-size:13px;color:var(--mut)}

.lk{opacity:.9}
.hl{list-style:none;margin:0;padding:0}.hl li{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--ln)}.hl small{display:block;color:var(--mut);font-size:12.5px}.hl b{white-space:nowrap}
.av{width:76px;height:76px;border-radius:26px;background:var(--btn);color:var(--btnt);display:grid;place-items:center;font-size:32px;font-weight:700}
.sw{width:52px;height:30px;border-radius:15px;background:var(--ln);position:relative;flex:none}.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked=true]{background:var(--em)}.sw[aria-checked=true] i{transform:translateX(22px)}
.ch text{fill:var(--mut);font-size:10px}
details{border-top:1px solid var(--ln);padding:10px 0}summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;min-height:30px;align-items:center}
summary::-webkit-details-marker{display:none}summary:after{content:"+";font-size:22px}details[open] summary:after{content:"−"}details p{margin:6px 0 2px;color:var(--mut)}
.dng{color:#B42318;background:none;border:2px solid #B4231855}
.sr{position:absolute;left:-9999px}
nav{position:relative;display:grid;grid-template-columns:repeat(5,1fr);margin:0 12px 10px;padding:6px;border-radius:28px;background:var(--nb);border:1px solid var(--ln);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
nav i{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);transform:translateX(calc(var(--t,0)*100%));transition:transform .35s cubic-bezier(.3,.8,.3,1)}
nav i:before{content:"";position:absolute;inset:0 3px;border-radius:22px;background:var(--mist)}
nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;font-size:10.5px;color:var(--mut)}
nav button.on{color:var(--ink);font-weight:700}
#md{position:fixed;inset:0;z-index:50;background:rgba(8,22,17,.55);display:flex;align-items:flex-end;justify-content:center}
#md[hidden]{display:none}
.sh{width:100%;max-width:440px;background:var(--card);border-radius:28px 28px 0 0;padding:22px 20px calc(18px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,.8,.2,1);max-height:88%;overflow:auto}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

 reset(){modal(`<h3 id="mt">Reiniciar el progrés?</h3><p>S’eliminaran els punts, l’historial, les insígnies, les recompenses i el progrés del quiz d’aquest dispositiu. Es conservaran el nom i les preferències. No es pot desfer.</p>`,[['Sí, reinicia',()=>{S=Object.assign(def(),{name:S.name,snd:S.snd,th:S.th,ask:1});qv=0;sel=-1;save();cm();render();toast('Progrés reiniciat')}],['Cancel·la',cm,1]])}};
function askName(first){modal(`<h3 id="mt">${first?'Benvingut a EcoBottle Loop':'El teu nom'}</h3><p>${first?'Pots posar-hi un nom, però és opcional. Les dades es queden només en aquest dispositiu.':'Edita el teu nom o deixa’l buit.'}</p><input id="ni" class="in" maxlength="18" autocomplete="off" placeholder="El teu nom (opcional)" value="${esc(S.name)}" aria-label="El teu nom">`,[['Desa',()=>{S.name=$('#ni').value.trim().slice(0,18);S.ask=1;save();cm();render();sfx('ok')}],[first?'Continua sense nom':'Cancel·la',()=>{S.ask=1;save();cm()},1]])}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a],[data-m]');if(!b)return;if(b.dataset.m!=null){const f=MB[+b.dataset.m];f&&f[1]();return}if(b.disabled)return;const a=b.dataset.a;if(!['scan','snd','qz','buy'].includes(a))sfx('tick');A[a]&&A[a](b,b.dataset)});
document.addEventListener('keydown',e=>{const t=e.target;if((e.key=='Enter'||e.key==' ')&&t.matches&&t.matches('g[data-a]')){e.preventDefault();t.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
 if(e.key=='Escape'&&!$('#md').hidden)cm();if(e.key=='Enter'&&t.id=='ni')MB[0][1]()});
document.addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value;$('#pl').innerHTML=plist()}});
render();if(!S.ask)askName(true);
})();
</script>
</body>
